.sm-grid{stroke:#e2ddd2;stroke-width:.7}.sm-star{fill:#8e9682;opacity:.55}.sm-grain{fill:#aaa89d;opacity:.4}
.sm-route-base{fill:none;stroke:#a4ad94;stroke-width:1.4}
.sm-route{fill:none;stroke:#69794f;stroke-width:2.5;stroke-dasharray:.15 .85;animation:travel 7s linear infinite}
.sm-node,.sm-project{fill:#67794e}.sm-node{animation:glimmer 4s ease-in-out infinite}
.sm-core{fill:#ad5b40}.sm-core-orbit{fill:none;stroke:#ad5b40;stroke-width:1;opacity:.3;animation:glimmer 4s ease-in-out infinite}
.sm-core-label{font-size:18px;fill:#ad5b40}.label{font-size:18px;font-weight:600}
.status{animation:glimmer 3s ease-in-out infinite}
@keyframes travel{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes glimmer{0%,100%{opacity:.35}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
