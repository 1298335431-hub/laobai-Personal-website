<style>
:root{--bg:oklch(0.17 0.035 267);--surface:oklch(0.21 0.033 267);--fg:oklch(0.91 0.012 255);--muted:oklch(0.68 0.022 255);--border:oklch(0.42 0.045 270);--accent:oklch(0.66 0.145 36);--font-body:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
text{fill:var(--fg);font-family:var(--font-body)}.muted{fill:var(--muted)}
    .sm-grid { stroke: var(--border); opacity: .3; stroke-dasharray: 1 9; fill: none; }
    .sm-star { fill: var(--muted); opacity: .6; animation: sm-stars 8s ease-in-out infinite; }
    .sm-grain { fill: var(--muted); opacity: .24; }
    .sm-route-base { fill: none; stroke: var(--border); stroke-width: 1.2; }
    .sm-route { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 0; stroke-linecap: round; animation: sm-draw 8s cubic-bezier(.4,0,.2,1) infinite both; }
    .sm-core-orbit { fill: none; stroke: var(--border); stroke-width: 1; transform-origin: 739.58px 409.3px; animation: sm-breathe 8s ease-in-out infinite; }
    .sm-core { fill: var(--fg); stroke: var(--bg); stroke-width: 5; transform-origin: 739.58px 409.3px; animation: sm-breathe 8s ease-in-out infinite; }
    .sm-core-label { fill: var(--fg); font: 500 14px var(--font-body); letter-spacing: 1px; }
    .sm-node { fill: var(--bg); stroke: var(--muted); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: sm-node-pulse 8s ease-in-out infinite; }
    .sm-project { fill: var(--muted); opacity: .62; transform-box: fill-box; transform-origin: center; animation: sm-project-pulse 8s ease-in-out infinite; }
    .sm-signal { offset-path: path('M739.58 409.3 L708.02 268.72 L838.04 215.62 L816.14 115.0 L838.04 215.62 L708.02 268.72 L739.58 409.3 L884.42 280.12 L956.78 269.68 L1070.0 173.92 L956.78 269.68 L884.42 280.12 L739.58 409.3 L580.94 397.48 L570.56 340.66 L480.62 336.1 L570.56 340.66 L580.94 397.48 L739.58 409.3 L708.02 268.72 L618.38 240.28 L470.0 235.6 L618.38 240.28 L708.02 268.72 L739.58 409.3'); offset-rotate: 0deg; animation: sm-travel 8s ease-in-out infinite, sm-signal-fade 8s ease-in-out infinite; }
    .sm-signal-halo { fill: var(--accent); opacity: .12; }
    .sm-signal-dot { fill: var(--accent); }
    .starmap[data-paused="true"] *, .starmap[data-offscreen="true"] * { animation-play-state: paused !important; }
    @keyframes sm-intro { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sm-stars { 0%,100% { opacity: .3; } 18%,75% { opacity: .68; } }
    @keyframes sm-breathe { 0%,100% { transform: scale(1); } 48% { transform: scale(1.045); } }
    @keyframes sm-draw { 0%,4% { stroke-dashoffset: 1; opacity: 0; } 10% { opacity: .7; } 24%,72% { stroke-dashoffset: 0; opacity: .7; } 98%,100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes sm-node-pulse { 0%,100% { transform: scale(1); fill: var(--bg); } 22%,29% { transform: scale(1.1); fill: var(--muted); } 42%,95% { transform: scale(1); fill: var(--bg); } }
    @keyframes sm-project-pulse { 0%,15%,100% { transform: scale(1); opacity: .62; } 27% { transform: scale(1.18); opacity: 1; } 42%,88% { transform: scale(1); opacity: .62; } }
    @keyframes sm-signal-fade { 0%,8%,97%,100% { opacity: 0; } 12%,91% { opacity: 1; } }
    @keyframes sm-arrow { 0%,55%,100% { transform: translate(0,0); } 76% { transform: translate(3px,-3px); } }
    @keyframes sm-travel {
      0% { offset-distance: 0.00000%; }
      10% { offset-distance: 0.00000%; }
      22% { offset-distance: 12.94735%; }
      24% { offset-distance: 12.94735%; }
      30% { offset-distance: 25.89470%; }
      42% { offset-distance: 39.77670%; }
      44% { offset-distance: 39.77670%; }
      50% { offset-distance: 53.65870%; }
      62% { offset-distance: 63.91286%; }
      64% { offset-distance: 63.91286%; }
      70% { offset-distance: 74.16702%; }
      82% { offset-distance: 87.08351%; }
      84% { offset-distance: 87.08351%; }
      94% { offset-distance: 100.00000%; }
      100% { offset-distance: 100.00000%; }
    }

@media(prefers-reduced-motion:reduce){*{animation:none!important}.sm-signal{display:none}.sm-route{opacity:.7}}
